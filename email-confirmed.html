<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이메일 확인 완료 · 오늘의 너</title>
<style>
  body {
    margin:0; background:#F8FBFB; color:#1C2A28;
    font:16px/1.75 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",
         "Pretendard","Malgun Gothic",sans-serif;
    display:flex; min-height:100vh; align-items:center;
  }
  .wrap { max-width:440px; margin:0 auto; padding:32px 24px; text-align:center; }
  .app {
    display:inline-block; font-size:13px; font-weight:700; letter-spacing:.4px;
    color:#10564E; background:#EBF9F7; padding:6px 12px; border-radius:999px;
  }
  .check {
    width:56px; height:56px; margin:24px auto 4px; border-radius:50%;
    background:#EBF9F7; color:#1F9E90; font-size:28px; line-height:56px;
  }
  h1 { font-size:24px; line-height:1.4; margin:8px 0 28px; letter-spacing:-.4px; }
  .row { margin:0 0 20px; }
  .row .msg { font-size:16px; color:#38504C; }
  .row .lang { font-size:12.5px; color:#7A8A87; margin-top:2px; }
  footer {
    margin-top:36px; padding-top:20px; border-top:1px solid #E6EDEC;
    font-size:13px; color:#7A8A87;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="app">오늘의 너 · Today's You</div>
  <div class="check">✓</div>

  <div class="row">
    <div class="msg">이메일이 확인됐어요. 앱으로 돌아가 로그인해주세요.</div>
    <div class="lang">한국어</div>
  </div>
  <div class="row">
    <div class="msg">Email confirmed. Please go back to the app and sign in.</div>
    <div class="lang">English</div>
  </div>
  <div class="row">
    <div class="msg">メール確認が完了しました。アプリに戻ってログインしてください。</div>
    <div class="lang">日本語</div>
  </div>
  <div class="row">
    <div class="msg">邮箱验证成功。请返回应用登录。</div>
    <div class="lang">简体中文</div>
  </div>
  <div class="row">
    <div class="msg">Correo confirmado. Vuelve a la app e inicia sesión.</div>
    <div class="lang">Español</div>
  </div>

  <footer>오늘의 너 · Today's You</footer>
</div>
</body>
</html>
